baseURL = 'https://soucoup.com/'
languageCode = 'en-us'
title = 'Matt Soucoup'

[pagination]
  pagerSize = 5

[params]
  description = "Matt Soucoup on the developer's place in an agentic coding future, with practical .NET and C#."
  author = "Matt Soucoup"
  showReadingTime = true
  showCodeCopyButtons = true
  showTableOfContents = true

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "Writing"
    url = "/posts/"
    weight = 1
  [[menu.main]]
    identifier = "talks"
    name = "Talks & courses"
    pageRef = "/talks-and-courses"
    weight = 2
  [[menu.main]]
    identifier = "about"
    name = "About"
    pageRef = "/about"
    weight = 4
  [[menu.main]]
    identifier = "subscribe"
    name = "Subscribe"
    url = "/subscribe/"
    weight = 5
  [[menu.main]]
    identifier = "search"
    name = "Search"
    url = "/search/"
    weight = 6

[outputs]
  home = ["HTML", "RSS", "JSON"]

[minify]
  [minify.tdewolff.html]
    keepComments = true

[markup]
  [markup.highlight]
    style = "monokai"
    lineNos = false
    codeFences = true
    guessSyntax = true
    noClasses = true
